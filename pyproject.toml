[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vectorguard"
version = "0.1.0"
description = "High-performance, vector-first data contract validation for Polars and PyArrow."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "David Caleb", email = "davidcaleb1998@hotmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-benchmark>=4.0.0",
    "pandera[polars]>=0.18.0",      # Added for benchmarking
]

[tool.hatch.build.targets.wheel]
packages = ["src/vectorguard"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
